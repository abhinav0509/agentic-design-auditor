<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Create an account</title></head>
<body>
<main>
<h1>Create an account</h1>
<img src="/img/welcome.jpg" alt="Hands holding a freshly glazed cup">
<form action="/signup" method="post">
<label for="su-email">Email</label>
<input id="su-email" type="email" name="email" autocomplete="email">
<label for="su-pass">Password</label>
<input id="su-pass" type="password" name="password" autocomplete="new-password">
<label><input type="checkbox" name="terms"> I agree to the terms</label>
<input type="submit" value="Create account">
</form>
</main>
</body>
</html>
